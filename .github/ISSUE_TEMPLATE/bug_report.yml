name: 问题报告
description: 提交可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交卡密、Cookie、二维码令牌、个人直播数据或未经检查的日志。安全问题请参考 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本与平台
      placeholder: 例如 0.3.1、Windows 11 x64、自行构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明场景来源、操作顺序、预期和实际结果。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的证据
      description: 可提供截图、最小复现场景或错误信息。
